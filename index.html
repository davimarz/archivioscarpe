<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio Scarpe - Prototipo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 { color: #333; text-align: center; }
        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .form-group input, .form-group select {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .shoe-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .shoe-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            background: #fff;
            position: relative;
        }
        .shoe-card h3 { margin-top: 0; color: #222; }
        .shoe-card p { margin: 5px 0; color: #555; font-size: 14px; }
        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            position: absolute;
            top: 15px;
            right: 15px;
        }
        .btn-delete:hover { background-color: #c82333; }
        .warning {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-left: 5px solid #ffeeba;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Archivio Scarpe</h1>
    
    <div class="warning">
        <strong>Nota:</strong> Questo è un prototipo locale. I dati non vengono inviati a nessun server e sono visibili solo su questo dispositivo.
    </div>

    <!-- Form di inserimento -->
    <form id="shoeForm">
        <div class="form-group">
            <input type="text" id="brand" placeholder="Marca (es. ASICS)" required>
            <input type="text" id="model" placeholder="Modello (es. Novablast 6)" required>
            <input type="text" id="color" placeholder="Colore (es. Nero/Ciano)" required>
            <input type="text" id="size" placeholder="Taglia (es. 42)" required>
            <input type="text" id="notes" placeholder="Note (es. Trovata in loco)">
            <button type="submit">Aggiungi Scarpa</button>
        </div>
    </form>

    <!-- Lista delle scarpe -->
    <div class="shoe-list" id="shoeList">
        <!-- Le schede delle scarpe verranno inserite qui -->
    </div>
</div>

<script>
    // Carica i dati dal localStorage o inizializza un array vuoto
    let shoes = JSON.parse(localStorage.getItem('shoeDatabase')) || [];

    // Funzione per visualizzare le scarpe
    function renderShoes() {
        const list = document.getElementById('shoeList');
        list.innerHTML = '';
        
        shoes.forEach((shoe, index) => {
            const card = document.createElement('div');
            card.className = 'shoe-card';
            card.innerHTML = `
                <button class="btn-delete" onclick="deleteShoe(${index})">Elimina</button>
                <h3>${shoe.brand} ${shoe.model}</h3>
                <p><strong>Colore:</strong> ${shoe.color}</p>
                <p><strong>Taglia:</strong> ${shoe.size}</p>
                <p><strong>Note:</strong> ${shoe.notes || 'Nessuna'}</p>
                <p style="font-size: 10px; color: #999;">ID: ${shoe.id}</p>
            `;
            list.appendChild(card);
        });
    }

    // Funzione per aggiungere una scarpa
    document.getElementById('shoeForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const newShoe = {
            id: Date.now().toString(), // Genera un ID univoco basato sul timestamp
            brand: document.getElementById('brand').value,
            model: document.getElementById('model').value,
            color: document.getElementById('color').value,
            size: document.getElementById('size').value,
            notes: document.getElementById('notes').value
        };

        shoes.push(newShoe);
        saveToLocalStorage();
        renderShoes();
        
        // Pulisci il form
        this.reset();
    });

    // Funzione per eliminare una scarpa
    window.deleteShoe = function(index) {
        if(confirm('Sei sicuro di voler eliminare questa scarpa dall\'archivio?')) {
            shoes.splice(index, 1);
            saveToLocalStorage();
            renderShoes();
        }
    }

    // Funzione per salvare nel localStorage del browser
    function saveToLocalStorage() {
        localStorage.setItem('shoeDatabase', JSON.stringify(shoes));
    }

    // Inizializza la vista
    renderShoes();
</script>

</body>
</html>
