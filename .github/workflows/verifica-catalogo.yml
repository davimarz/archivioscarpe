name: Verifica catalogo offerte
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'
  push:
    paths:
      - 'catalogo-awin.json'
      - 'catalogo-awin-report.json'
      - 'tools/awin/verifica-catalogo.cjs'
      - '.github/workflows/verifica-catalogo.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/awin/verifica-catalogo.cjs
